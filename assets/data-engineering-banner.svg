<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#082F49"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#38BDF8"
            stroke-opacity="0.08"/>
    </pattern>

  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <!-- DATA STREAMS -->

  <g stroke="#22D3EE"
     stroke-width="2"
     fill="none"
     opacity="0.7">

    <path d="M40 70 C180 20 240 120 350 70 S550 40 680 80"/>
    <path d="M40 300 C180 350 250 250 380 290 S560 330 700 280"/>
    <path d="M900 70 C1000 30 1080 100 1160 60"/>
    <path d="M900 290 C1000 330 1080 250 1160 300"/>

  </g>

  <!-- MOVING DATA PARTICLES -->

  <circle r="5" fill="#67E8F9" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite"
      path="M40 70 C180 20 240 120 350 70 S550 40 680 80"/>
  </circle>

  <circle r="5" fill="#22D3EE" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite"
      path="M40 300 C180 350 250 250 380 290 S560 330 700 280"/>
  </circle>

  <circle r="5" fill="#38BDF8" filter="url(#glow)">
    <animateMotion dur="3.5s" repeatCount="indefinite"
      path="M900 70 C1000 30 1080 100 1160 60"/>
  </circle>

  <!-- PIPELINE NODES -->

  <g font-family="Arial, sans-serif"
     font-size="13"
     text-anchor="middle">

    <!-- INGESTION -->

    <rect x="55" y="115" width="130" height="55"
          rx="12"
          fill="#0F172A"
          stroke="#22D3EE"/>

    <text x="120" y="138" fill="#67E8F9">
      DATA INGESTION
    </text>

    <text x="120" y="157" fill="#94A3B8">
      API / STREAMS
    </text>


    <!-- ETL -->

    <rect x="220" y="115" width="130" height="55"
          rx="12"
          fill="#0F172A"
          stroke="#38BDF8"/>

    <text x="285" y="138" fill="#7DD3FC">
      ETL / ELT
    </text>

    <text x="285" y="157" fill="#94A3B8">
      TRANSFORM
    </text>


    <!-- DATABASE -->

    <rect x="385" y="115" width="145" height="55"
          rx="12"
          fill="#0F172A"
          stroke="#06B6D4"/>

    <text x="457" y="138" fill="#67E8F9">
      DATA WAREHOUSE
    </text>

    <text x="457" y="157" fill="#94A3B8">
      SQL / CLOUD
    </text>


    <!-- ML -->

    <rect x="565" y="115" width="130" height="55"
          rx="12"
          fill="#0F172A"
          stroke="#22D3EE"/>

    <text x="630" y="138" fill="#67E8F9">
      ML / AI
    </text>

    <text x="630" y="157" fill="#94A3B8">
      MODELS
    </text>


    <!-- DASHBOARD -->

    <rect x="730" y="115" width="145" height="55"
          rx="12"
          fill="#0F172A"
          stroke="#38BDF8"/>

    <text x="802" y="138" fill="#7DD3FC">
      ANALYTICS
    </text>

    <text x="802" y="157" fill="#94A3B8">
      DASHBOARDS
    </text>

  </g>


  <!-- CONNECTIONS -->

  <g stroke="#38BDF8"
     stroke-width="2"
     opacity="0.7">

    <line x1="185" y1="142" x2="220" y2="142"/>
    <line x1="350" y1="142" x2="385" y2="142"/>
    <line x1="530" y1="142" x2="565" y2="142"/>
    <line x1="695" y1="142" x2="730" y2="142"/>

  </g>


  <!-- MAIN NAME -->

  <text x="600"
        y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="58"
        font-weight="800"
        letter-spacing="4"
        fill="#FFFFFF">

    ROHAN NAIK

    <animate
      attributeName="opacity"
      values="0;1;1;0.85;1"
      dur="3s"
      repeatCount="indefinite"/>

  </text>


  <!-- TITLE -->

  <text x="600"
        y="260"
        text-anchor="middle"
        font-family="monospace"
        font-size="18"
        letter-spacing="2"
        fill="#67E8F9">

    DATA SCIENCE &amp; AI  •  DATA ENGINEERING  •  ML  •  MLOps  •  DevOps

    <animate
      attributeName="opacity"
      values="0.4;1;0.4"
      dur="2.5s"
      repeatCount="indefinite"/>

  </text>


  <!-- BOTTOM PIPELINE -->

  <text x="600"
        y="310"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#CBD5E1">

    RAW DATA  →  INGEST  →  ETL  →  WAREHOUSE  →  ML  →  INSIGHTS

  </text>

  <!-- BORDER -->

  <rect x="3"
        y="3"
        width="1194"
        height="354"
        rx="22"
        fill="none"
        stroke="#22D3EE"
        stroke-opacity="0.45"/>

</svg>
